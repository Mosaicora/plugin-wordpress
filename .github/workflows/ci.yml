name: Continuous integration

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: zip
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Audit dependencies
        run: composer audit --locked --no-interaction
      - name: Run unit and integration tests
        run: composer test
      - name: Check PHP syntax
        run: composer lint
      - name: Check WordPress coding standards
        run: composer phpcs
      - name: Verify release metadata
        run: composer release:check

  browser:
    name: WordPress 7.0 browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install browser dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start WordPress
        run: pnpm wp:start
      - name: Run block and classic editor smoke tests
        run: pnpm test:e2e
      - name: Stop WordPress
        if: always()
        run: pnpm wp:stop

  package:
    name: WordPress.org package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: zip
      - name: Install production dependencies
        run: composer install --no-dev --classmap-authoritative --no-interaction --prefer-dist --no-progress
      - name: Build release archive
        run: composer package
      - name: Verify release archive
        run: composer release:check
      - name: Unpack release archive
        run: unzip -q build/mosaicora-*.zip -d release-build
      - name: Run official WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./release-build/mosaicora
          wp-version: "7.0"
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: mosaicora-wordpress
          path: build/mosaicora-*.zip
          if-no-files-found: error
