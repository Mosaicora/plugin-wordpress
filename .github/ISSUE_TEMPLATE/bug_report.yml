name: Bug report
description: Report a reproducible problem with Mosaicora for WordPress.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thank you for helping us improve Mosaicora. Please do not include secrets or private content.
  - type: input
    id: plugin-version
    attributes:
      label: Mosaicora plugin version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: wordpress-version
    attributes:
      label: WordPress version
      placeholder: 7.0.2
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: 8.3
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the result and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant environment details
      description: Include the active theme and SEO plugins when they may be related.
  - type: checkboxes
    id: security
    attributes:
      label: Security confirmation
      options:
        - label: This report does not disclose a security vulnerability or private data.
          required: true
