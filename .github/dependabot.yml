version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer-development:
        dependency-type: development
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      browser-testing:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
